name: CI — Kod Kalite ve Build Kontrolü

# Tüm iş branch'i push'larında ve dev/test/main PR'larında çalışır.
# Amaç: hataları bir sonraki dala terfi etmeden yakalamak.
on:
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
      - chore/**
      - infra/**
      # Eski isimlendirme — geçiş dönemi için korunuyor
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

jobs:
  # ─── Terfi zinciri denetimi ──────────────────────────────────────────────────
  # Akış: feat/* → dev → test → main. Sıra atlanırsa dallar ayrışır.
  # Bu repoda bir kez yaşandı (#482 dev'i atladı → sync/test-to-dev yaması gerekti).
  enforce-promotion:
    name: Terfi Zinciri Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'test' || github.base_ref == 'main')

    steps:
      - name: Kaynak branch'i doğrula
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "test" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::'test' dalına yalnızca 'dev' üzerinden PR açılabilir. Gelen: '$HEAD'"
            exit 1
          fi

          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              test|hotfix/*) ;;
              *)
                echo "::error::'main' dalına yalnızca 'test' veya 'hotfix/*' üzerinden PR açılabilir. Gelen: '$HEAD'"
                exit 1
                ;;
            esac
          fi

          echo "Terfi zinciri geçerli: $HEAD → $BASE"

  # ─── Frontend CI ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: npm versiyonunu güncelle
        run: npm install -g npm@11.6.1

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: ESLint kontrolü
        run: npm run lint

      - name: Prettier format kontrolü
        run: npm run format:check

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
          VITE_APP_VERSION: ci
          VITE_APP_ENV: test

      - name: Birim testleri (Vitest)
        run: npm run test:ci
        env:
          NODE_ENV: test

  # ─── Backend CI ──────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: NuGet paketlerini yükle
        run: dotnet restore cargo-pilot.sln

      - name: Build (Release)
        run: dotnet build cargo-pilot.sln --no-restore --configuration Release

      - name: Testleri çalıştır
        run: |
          TEST_PROJECTS=$(find apps/backend -name "*.Tests.csproj" -o -name "*.Test.csproj" 2>/dev/null)
          if [ -z "$TEST_PROJECTS" ]; then
            echo "Test projesi bulunamadı, adım atlanıyor."
          else
            dotnet test cargo-pilot.sln --no-build --configuration Release --verbosity normal
          fi

  # ─── Docker Image Build (main'e giden PR ve iş branch'i push'ları) ───────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-ci, backend-ci]
    permissions:
      contents: read
      packages: read
    # PR → test/main'de image build test-deploy.yml'deki "Image Build" job'u ile yapılır;
    # burada yalnızca ilk kapıda (dev) ve iş branch'i push'larında koşar.
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push')

    steps:
      - name: Kodu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: GHCR'a giriş yap
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Docker image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/backend/
          push: false
          tags: cargo-pilot-backend:ci
          build-args: |
            DOTNET_SDK_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-sdk:8.0
            DOTNET_ASPNET_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-aspnet:8.0
          cache-from: type=gha,scope=cargo-pilot-backend-ci
          cache-to: type=gha,mode=max,scope=cargo-pilot-backend-ci

      - name: Frontend Docker image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/frontend/
          push: false
          tags: cargo-pilot-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api/v1
          cache-from: type=gha,scope=cargo-pilot-frontend-ci
          cache-to: type=gha,mode=max,scope=cargo-pilot-frontend-ci
