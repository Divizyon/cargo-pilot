name: CI — Kod Kalite ve Build Kontrolü

# Tüm iş branch'i push'larında ve dev/test/main PR'larında çalışır.
# Amaç: hataları bir sonraki dala terfi etmeden yakalamak.
#
# D-09: `docker-build` job'u kaldırıldı. Docker imaj kapısı tamamen
# `test-deploy.yml`'e ait: iş branch'i push'unda `Deploy (Test)` iki imajı da build
# ediyor VE compose ile ayağa kaldırıp healthcheck'ten geçiriyor; PR → test'te ayrıca
# `Image Build` koşuyor. Buradaki build'in tek özgün katkısı merge commit'inin imaj
# build'iydi, o da PR → test kapısında yakalanıyor. Hiçbir ruleset `Docker Image Build`
# adlı check'i zorunlu tutmuyordu (dev-protection: Frontend CI + Backend CI).
on:
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
      - chore/**
      - infra/**
      # Eski isimlendirme — geçiş dönemi için korunuyor
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

# Aynı branch'e hızlı ardışık push'lar tam CI'ı baştan koşuyordu (ölçüm:
# feat/algoritma-arama-katmani'nda 8 koşum, ikisi saniyeler arayla).
#
# `cancel-in-progress` BİLEREK yalnız pull_request'te açık:
# ci.yml korunan dallarda zorunlu check üretiyor (Frontend CI, Backend CI, Terfi
# Zinciri Kontrolü). İptal edilen koşumun check'i `cancelled` durumunda kalır ve o
# commit'te merge'i bloke eder. Push koşumları PR'ın head SHA'sıyla aynı commit'e
# check yazdığı için push tarafında iptal ETMEK bu riski doğurur; PR tarafında ise
# iptal edilen koşum her zaman ESKİ head SHA'ya aittir, merge kapısı yalnızca
# güncel head SHA'ya bakar — güvenli.
#
# Grup adı: github.ref push'ta refs/heads/<branch>, pull_request'te
# refs/pull/<n>/merge → PR ve push koşumları ayrı gruplara düşer, birbirini iptal
# edemez. concurrency bağlamında `github` context'i kullanılabilir (secrets/matrix
# kullanılamaz), bu yüzden github.event_name ifadesi burada değerlendirilir.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Terfi zinciri denetimi ──────────────────────────────────────────────────
  # Akış: feat/* → dev → test → main. Sıra atlanırsa dallar ayrışır.
  # Bu repoda bir kez yaşandı (#482 dev'i atladı → sync/test-to-dev yaması gerekti).
  enforce-promotion:
    name: Terfi Zinciri Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'test' || github.base_ref == 'main')

    steps:
      - name: Kaynak branch'i doğrula
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "test" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::'test' dalına yalnızca 'dev' üzerinden PR açılabilir. Gelen: '$HEAD'"
            exit 1
          fi

          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              test|hotfix/*) ;;
              *)
                echo "::error::'main' dalına yalnızca 'test' veya 'hotfix/*' üzerinden PR açılabilir. Gelen: '$HEAD'"
                exit 1
                ;;
            esac
          fi

          echo "Terfi zinciri geçerli: $HEAD → $BASE"

  # ─── Frontend CI ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # setup-node'un dahili `cache: 'npm'`i yerine açık restore: yazma YOK.
      # Gerekçe ve tek yazıcı için cache-seed.yml'deki "npm cache seed" bloğuna bakın.
      - name: npm cache geri yükle (yazmaz)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json', 'apps/algorithm-test-ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: npm versiyonunu güncelle
        run: npm install -g npm@11.6.1

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: ESLint kontrolü
        run: npm run lint

      - name: Prettier format kontrolü
        run: npm run format:check

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
          VITE_APP_VERSION: ci
          VITE_APP_ENV: test

      - name: Birim testleri (Vitest)
        run: npm run test:ci
        env:
          NODE_ENV: test

  # ─── Algoritma Test Arayüzü CI ───────────────────────────────────────────────
  # Bağımsız uygulama (apps/algorithm-test-ui): kendi lockfile'ı, kendi portu,
  # apps/frontend'den hiçbir şey import etmiyor. ESLint/Prettier yapılandırması
  # yok, bu yüzden kapı tsc + build + Vitest.
  algorithm-test-ui-ci:
    name: Algoritma Test Arayüzü CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/algorithm-test-ui

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # Anahtar frontend-ci ile birebir aynı: ~/.npm tek bir paket deposu, iki
      # lockfile'ın paketleri aynı girişte duruyor. Bkz. cache-seed.yml.
      - name: npm cache geri yükle (yazmaz)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json', 'apps/algorithm-test-ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: TypeScript + Vite build
        run: npm run build

      # Toplu koşu aracı (npm run suite) ayrı bir giriş noktasından derleniyor;
      # uygulama build'i onu kapsamıyor. Derlenmezse regresyon kapısı sessizce
      # çürür — koşulmadan da olsa derlendiği doğrulanmalı.
      - name: Toplu koşu aracını derle
        run: npm run build:suite

      # goldenCrossCheck.test.ts backend'in Snapshots/*.json fixture'larını okur:
      # denetleyicilerin motoru doğru aynaladığının kanıtı budur, checkout'ta
      # ikisi de aynı ağaçta olduğu için ek adım gerekmez.
      - name: Birim testleri (Vitest)
        run: npm run test:ci

      # Test düştüğünde de yüklensin; hangi vakanın kaldığı PR'dan görünsün.
      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algoritma-test-sonuclari
          path: apps/algorithm-test-ui/reports/junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ─── Backend CI ──────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: NuGet paketlerini yükle
        run: dotnet restore cargo-pilot.sln

      - name: Build (Release)
        run: dotnet build cargo-pilot.sln --no-restore --configuration Release

      # dotnet test, hiç test projesi olmayan bir çözümde sessizce başarılı döner.
      # Test kapısının kaldırılmasını yakalamak için varlık kontrolü ayrı adımda zorunlu.
      - name: Test projesi varlığını doğrula
        run: |
          TEST_PROJECTS=$(find apps/backend -name "*.Tests.csproj" -o -name "*.Test.csproj")
          if [ -z "$TEST_PROJECTS" ]; then
            echo "::error::Backend test projesi bulunamadı — CI'ın yanlış yeşil dönmemesi için hata veriliyor."
            exit 1
          fi

      - name: Testleri çalıştır
        run: dotnet test cargo-pilot.sln --no-build --configuration Release --verbosity normal
