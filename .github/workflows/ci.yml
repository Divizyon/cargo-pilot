name: CI — Kod Kalite ve Build Kontrolü

# Tüm iş branch'i push'larında ve main PR'larında çalışır.
# Amaç: hataları main'e ulaşmadan yakalamak.
on:
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
      - chore/**
      - infra/**
      # Eski isimlendirme — geçiş dönemi için korunuyor
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - main

jobs:
  # ─── Frontend CI ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: npm versiyonunu güncelle
        run: npm install -g npm@11.6.1

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: ESLint kontrolü
        run: npm run lint

      - name: Prettier format kontrolü
        run: npm run format:check

      - name: TypeScript + Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
          VITE_APP_VERSION: ci
          VITE_APP_ENV: test

      - name: Birim testleri (Vitest)
        run: npm run test:ci
        env:
          NODE_ENV: test

  # ─── Backend CI ──────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: NuGet paketlerini yükle
        run: dotnet restore cargo-pilot.sln

      - name: Build (Release)
        run: dotnet build cargo-pilot.sln --no-restore --configuration Release

      - name: Testleri çalıştır
        run: |
          TEST_PROJECTS=$(find apps/backend -name "*.Tests.csproj" -o -name "*.Test.csproj" 2>/dev/null)
          if [ -z "$TEST_PROJECTS" ]; then
            echo "Test projesi bulunamadı, adım atlanıyor."
          else
            dotnet test cargo-pilot.sln --no-build --configuration Release --verbosity normal
          fi

  # ─── Docker Image Build (main'e giden PR ve iş branch'i push'ları) ───────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    permissions:
      contents: read
      packages: read
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR'a giriş yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Docker image build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend/
          push: false
          tags: cargo-pilot-backend:ci
          build-args: |
            DOTNET_SDK_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-sdk:8.0
            DOTNET_ASPNET_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-aspnet:8.0
          cache-from: type=gha,scope=cargo-pilot-backend-ci
          cache-to: type=gha,mode=max,scope=cargo-pilot-backend-ci

      - name: Frontend Docker image build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend/
          push: false
          tags: cargo-pilot-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api/v1
          cache-from: type=gha,scope=cargo-pilot-frontend-ci
          cache-to: type=gha,mode=max,scope=cargo-pilot-frontend-ci
