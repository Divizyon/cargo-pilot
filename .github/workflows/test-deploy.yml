name: Test Ortamı CI/CD

on:
  push:
    branches:
      - test
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - test
      - dev

jobs:
  # ─── Job 1: Her PR ve push'ta çalışır — sadece image build ───────────────────
  build:
    name: Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Backend image build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: cargo-pilot-backend:test
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Frontend image build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          load: true
          tags: cargo-pilot-frontend:test
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Image'ları artifact olarak kaydet
        run: |
          docker save cargo-pilot-backend:test cargo-pilot-frontend:test \
            | gzip > /tmp/app-images.tar.gz

      - name: Artifact'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-images
          path: /tmp/app-images.tar.gz
          retention-days: 1

  # ─── Job 2: Sadece test branch'ine push'ta çalışır — full deploy ─────────────
  deploy:
    name: Deploy (Test)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'

    env:
      ENVIRONMENT: test
      BACKEND_PORT: 8081
      FRONTEND_PORT: 3001
      MSSQL_PORT: 1434
      MSSQL_DATABASE: CargoPilotTest
      # Secret yoksa CI için geçerli bir fallback parola kullanılır
      MSSQL_SA_PASSWORD: ${{ secrets.TEST_MSSQL_SA_PASSWORD || 'CiTestPassword123!' }}
      MINIO_API_PORT: 9002
      MINIO_CONSOLE_PORT: 9003
      MINIO_ROOT_USER: ${{ secrets.TEST_MINIO_ROOT_USER || 'minioadmin' }}
      MINIO_ROOT_PASSWORD: ${{ secrets.TEST_MINIO_ROOT_PASSWORD || 'minioadmin123' }}
      MINIO_BUCKET: cargo-pilot-test

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # Infrastructure image'ları (MSSQL ~490MB, MinIO ~100MB) cache'lenir.
      # İlk çalıştırmada pull edilip cache'e yazılır, sonraki çalıştırmalarda
      # cache'den yüklenir — her seferinde pull edilmez.
      - name: Infrastructure image cache'i kontrol et
        id: infra-cache
        uses: actions/cache@v4
        with:
          path: /tmp/infra-images
          key: infra-images-mssql2022-minio-latest-v1

      - name: Infrastructure image'larını pull et ve cache'e kaydet
        if: steps.infra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/infra-images
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker pull quay.io/minio/minio:latest
          docker save mcr.microsoft.com/mssql/server:2022-latest \
            | gzip > /tmp/infra-images/mssql.tar.gz
          docker save quay.io/minio/minio:latest \
            | gzip > /tmp/infra-images/minio.tar.gz

      - name: Infrastructure image'larını cache'den yükle
        if: steps.infra-cache.outputs.cache-hit == 'true'
        run: |
          docker load < /tmp/infra-images/mssql.tar.gz
          docker load < /tmp/infra-images/minio.tar.gz

      - name: Uygulama image'larını build job'dan indir
        uses: actions/download-artifact@v4
        with:
          name: app-images
          path: /tmp

      - name: Uygulama image'larını docker'a yükle
        run: docker load < /tmp/app-images.tar.gz

      # --wait: tüm healthcheck'ler geçene kadar bekler (özel polling gerekmez)
      # --wait-timeout: toplam bekleme süresi (saniye)
      - name: Servisleri ayağa kaldır ve hazır olmasını bekle
        run: |
          docker compose \
            -f infra/compose/docker-compose.test.yml \
            up -d --no-build --wait --wait-timeout 300

      - name: Backend sağlık kontrolü
        run: |
          timeout 60 bash -c '
            until curl -sf http://localhost:${{ env.BACKEND_PORT }}/health; do
              echo "Backend bekleniyor..."
              sleep 5
            done
          '
          echo "Backend hazır."

      - name: Frontend sağlık kontrolü
        run: |
          timeout 60 bash -c '
            until curl -sf http://localhost:${{ env.FRONTEND_PORT }}; do
              echo "Frontend bekleniyor..."
              sleep 5
            done
          '
          echo "Frontend hazır."

      - name: Servis loglarını göster (başarısızlık durumunda)
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml logs --tail=100

      - name: Servisleri durdur ve temizle
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml down -v
