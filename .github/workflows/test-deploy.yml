name: Test Ortamı CI/CD

# Üç dallı terfi modeli: feat/* → dev → test → main
# Test SUNUCUSU'nun kaynağı `test` dalıdır; gösterilen ve QA'in denediği sürüm odur.
# `main` production'a ayrılmıştır — prod sunucusu kurulana kadar deploy tetiklemez.
#
# Tetikleyiciler:
#   push (iş branch'leri)  → geçici stack ile doğrulama (inline build + healthcheck)
#   pull_request → test    → migration + build + geçici stack doğrulaması
#   pull_request → main    → yalnızca migration kontrolü (içerik test'te zaten koştu)
#   push (test)            → build + GHCR push + test sunucusuna deploy
on:
  push:
    branches:
      - test
      - feat/**
      - fix/**
      - hotfix/**
      - chore/**
      - infra/**
      # Eski isimlendirme — geçiş dönemi için korunuyor
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - test
      - main

permissions:
  contents: read

jobs:
  # ─── Migration kontrolü: model değişmiş ama migration oluşturulmamışsa fail ──
  # test/main PR'larında ve test push'ta çalışır (iş branch'i push'larında gereksiz)
  migration-check:
    name: Pending Migration Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'pull_request' && (github.base_ref == 'test' || github.base_ref == 'main')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/test')

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: EF Core CLI kur
        run: dotnet tool install --global dotnet-ef

      - name: NuGet paketlerini yükle
        run: dotnet restore apps/backend/CargoPilot.WebAPI/CargoPilot.WebAPI.csproj

      # D-13(c): Bu job yalnızca design-time model karşılaştırması yapar; test
      # projelerinin derlenmesine ihtiyacı yok. Eskiden tüm solution (7 proje)
      # derleniyordu, `backend-ci` de aynı solution'ı Release'de derliyor.
      # Artık yalnız `dotnet ef`in gerçekten yüklediği graf derleniyor:
      # WebAPI (startup) → Infrastructure → Application → Domain.
      # Configuration bilinçli olarak Release kalıyor: yerel ölçümde Debug hiçbir
      # şey kazandırmıyor (temiz build 5,97 sn Debug / 6,21 sn Release, aynı 1965
      # uyarı) — maliyet analyzer'larda, optimizasyonda değil. Bkz. D-35 / #1049.
      - name: Backend build (migration check için)
        run: dotnet build apps/backend/CargoPilot.WebAPI/CargoPilot.WebAPI.csproj --configuration Release --no-restore

      - name: Pending model değişikliği kontrolü
        # AppDbContextFactory design-time'da connection string gerektirir;
        # gerçek DB bağlantısı kurulmaz, sadece model karşılaştırması yapılır.
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=ci_check;User Id=sa;Password=CI_placeholder_not_used!;"
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project apps/backend/CargoPilot.Infrastructure \
            --startup-project apps/backend/CargoPilot.WebAPI \
            --configuration Release
          echo "Migration kontrolü geçti: bekleyen model değişikliği yok."

  # ─── Build job: test'e giden PR'da veya test'e push'ta çalışır ──────────────
  # US-D27-I: test push'ta image'lar GHCR'a push edilir.
  # Her push'ta hem :test (mutable, latest) hem :test-{sha} (immutable) tag'i push edilir.
  # deploy-test-server job'u immutable tag'i kullanır; rollback için geçmişe erişim sağlar.
  build:
    name: Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'test') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/test')

    # packages: write — GHCR'a push edebilmek için gerekli
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Image tag belirle (immutable: test-{short-sha})"
        id: sha
        run: echo "tag=test-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Base image pull + push için GHCR auth; GITHUB_TOKEN her trigger'da geçerli
      - name: GHCR'a giriş yap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push: PR'larda false, test branch push'ta true
      # :test → mutable (latest), :test-{sha} → immutable (rollback için)
      - name: Backend image build ve GHCR push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test' }}
          tags: |
            ghcr.io/divizyon/cargo-pilot-backend:test
            ghcr.io/divizyon/cargo-pilot-backend:${{ steps.sha.outputs.tag }}
          build-args: |
            DOTNET_SDK_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-sdk:8.0
            DOTNET_ASPNET_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-aspnet:8.0
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=min,scope=backend-test

      - name: Frontend image build ve GHCR push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test' }}
          tags: |
            ghcr.io/divizyon/cargo-pilot-frontend:test
            ghcr.io/divizyon/cargo-pilot-frontend:${{ steps.sha.outputs.tag }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_OAUTH_GOOGLE_URL=${{ secrets.VITE_OAUTH_GOOGLE_URL }}
            VITE_OAUTH_MICROSOFT_URL=${{ secrets.VITE_OAUTH_MICROSOFT_URL }}
            VITE_APP_ENV=test
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

  # ─── Deploy job: her ilgili trigger'da çalışır; image'ları inline build eder ──
  deploy:
    name: Deploy (Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [migration-check, build]
    permissions:
      contents: read
      packages: read
    if: |
      always() &&
      (needs.migration-check.result == 'success' || needs.migration-check.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && github.base_ref == 'test') ||
        (github.event_name == 'push')
      )

    env:
      ENVIRONMENT: test
      BACKEND_PORT: 8081
      FRONTEND_PORT: 3001
      MSSQL_PORT: 1434
      MSSQL_DATABASE: CargoPilotTest
      # Secret yoksa CI için geçerli bir fallback parola kullanılır
      MSSQL_SA_PASSWORD: ${{ secrets.TEST_MSSQL_SA_PASSWORD || 'CiTestPassword123!' }}
      MINIO_API_PORT: 9002
      MINIO_CONSOLE_PORT: 9003
      MINIO_ROOT_USER: ${{ secrets.TEST_MINIO_ROOT_USER || 'minioadmin' }}
      MINIO_ROOT_PASSWORD: ${{ secrets.TEST_MINIO_ROOT_PASSWORD || 'minioadmin123' }}
      MINIO_BUCKET: cargo-pilot-test
      # Seed için varsayılan admin şifresi — CI fallback değeri
      Seed__DefaultAdminPassword: ${{ secrets.SEED_DEFAULT_ADMIN_PASSWORD || 'Admin@CargoPilot1!' }}
      # JWT secret — en az 32 karakter olmalı
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-at-least-32-chars-long!' }}
      # Resend — CI'da dummy değerler; gerçek değerler sunucudaki .env.test'te
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-resend-api-key-placeholder' }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'ci@example.com' }}
      RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME || 'Cargo Pilot CI' }}
      PASSWORD_RESET_FRONTEND_URL: ${{ secrets.PASSWORD_RESET_FRONTEND_URL || 'http://localhost:3001/auth/reset-password' }}
      EMAIL_CHANGE_FRONTEND_CONFIRM_URL: ${{ secrets.EMAIL_CHANGE_FRONTEND_CONFIRM_URL || 'http://localhost:3001/confirm-email-change' }}

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Base image pull için GHCR auth; GITHUB_TOKEN her trigger'da geçerli
      - name: GHCR'a giriş yap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy kendi image'larını inline build eder; build job ile aynı GHA cache
      # scope'u kullanılır ve deploy artık build job'undan SONRA başlar (needs: build),
      # bu yüzden cache-from build job'un yazdığı katmanlara gerçekten isabet alır.
      # Deploy kendisi cache'e YAZMAZ — tek yazıcı build job'dur.
      # Tag'ler docker-compose.test.yml'deki image: alanlarıyla eşleşmeli.
      # load: true → image'ı local Docker daemon'a yükle (no push)
      - name: Backend image build (deploy için)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/divizyon/cargo-pilot-backend:test
          build-args: |
            DOTNET_SDK_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-sdk:8.0
            DOTNET_ASPNET_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-aspnet:8.0
          cache-from: type=gha,scope=backend-test

      - name: Frontend image build (deploy için)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/divizyon/cargo-pilot-frontend:test
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_OAUTH_GOOGLE_URL=${{ secrets.VITE_OAUTH_GOOGLE_URL }}
            VITE_OAUTH_MICROSOFT_URL=${{ secrets.VITE_OAUTH_MICROSOFT_URL }}
            VITE_APP_ENV=test
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend-test

      - name: Servisleri ayağa kaldır ve hazır olmasını bekle
        run: |
          docker compose \
            -f infra/compose/docker-compose.test.yml \
            up -d --no-build --wait --wait-timeout 300

      - name: Backend sağlık kontrolü
        run: |
          timeout 180 bash -c '
            until curl -sf http://localhost:${{ env.BACKEND_PORT }}/health; do
              echo "Backend bekleniyor..."
              sleep 10
            done
          '
          echo "Backend hazır."

      - name: Frontend sağlık kontrolü
        run: |
          timeout 180 bash -c '
            until curl -sf http://localhost:${{ env.FRONTEND_PORT }}; do
              echo "Frontend bekleniyor..."
              sleep 10
            done
          '
          echo "Frontend hazır."

      - name: Servis loglarını göster (başarısızlık durumunda)
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml logs --tail=100

      - name: Servisleri durdur ve temizle
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml down -v

  # ─── E2E smoke: compose ortamı + sahte ERP MSSQL'e karşı Playwright ────────
  # Deploy doğrulaması geçtikten sonra koşar; kendi stack'ini `--profile e2e` ile
  # ayağa kaldırır (deploy job'u kendi stack'ini zaten kapatmıştır).
  e2e-smoke:
    name: E2E Smoke (ERP)
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: read
      packages: read
    if: needs.deploy.result == 'success'

    env:
      ENVIRONMENT: test
      BACKEND_PORT: 8081
      FRONTEND_PORT: 3001
      MSSQL_PORT: 1434
      MSSQL_DATABASE: CargoPilotTest
      MSSQL_SA_PASSWORD: ${{ secrets.TEST_MSSQL_SA_PASSWORD || 'CiTestPassword123!' }}
      MINIO_API_PORT: 9002
      MINIO_CONSOLE_PORT: 9003
      MINIO_ROOT_USER: ${{ secrets.TEST_MINIO_ROOT_USER || 'minioadmin' }}
      MINIO_ROOT_PASSWORD: ${{ secrets.TEST_MINIO_ROOT_PASSWORD || 'minioadmin123' }}
      MINIO_BUCKET: cargo-pilot-test
      Seed__DefaultAdminPassword: ${{ secrets.SEED_DEFAULT_ADMIN_PASSWORD || 'Admin@CargoPilot1!' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-at-least-32-chars-long!' }}
      # E-posta gönderimi smoke kapsamında değil; placeholder yeterlidir.
      RESEND_API_KEY: ci-resend-api-key-placeholder
      RESEND_FROM_EMAIL: ci@example.com
      RESEND_FROM_NAME: Cargo Pilot CI
      PASSWORD_RESET_FRONTEND_URL: http://localhost:3001/auth/reset-password
      EMAIL_CHANGE_FRONTEND_CONFIRM_URL: http://localhost:3001/confirm-email-change
      # Sahte ERP kaynağı (yalnızca e2e profili)
      ERP_MSSQL_PORT: 1435
      ERP_MSSQL_SA_PASSWORD: ErpFake_Pass123!
      ERP_MSSQL_MEMORY_LIMIT_MB: 1024

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: GHCR'a giriş yap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image build (e2e için)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/divizyon/cargo-pilot-backend:test
          build-args: |
            DOTNET_SDK_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-sdk:8.0
            DOTNET_ASPNET_IMAGE=ghcr.io/divizyon/cargo-pilot-dotnet-aspnet:8.0
          cache-from: type=gha,scope=backend-test

      - name: Frontend image build (e2e için)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/divizyon/cargo-pilot-frontend:test
          build-args: |
            VITE_API_BASE_URL=
            VITE_APP_ENV=test
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend-test

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # setup-node'un dahili `cache: 'npm'`i yerine açık restore: yazma YOK.
      # Bu job iş branch'i push'larında da koşuyor, yani her branch'e kendi ~/.npm
      # kopyasını yazan üç yazıcıdan biriydi. Anahtar ci.yml ile birebir aynı;
      # gerekçe ve tek yazıcı için cache-seed.yml'deki "npm cache seed" bloğuna bakın.
      - name: npm cache geri yükle (yazmaz)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json', 'apps/algorithm-test-ui/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Bağımlılıkları yükle
        working-directory: apps/frontend
        run: npm ci

      - name: Playwright tarayıcısını kur
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Stack'i ayağa kaldır (sahte ERP dahil)
        run: |
          docker compose \
            -f infra/compose/docker-compose.test.yml \
            --profile e2e \
            up -d --no-build --wait --wait-timeout 420

      # Bağımlılığı (erp-mssql) çözebilmek için her iki profil de açılır.
      - name: Sahte ERP verisini yükle
        run: |
          docker compose \
            -f infra/compose/docker-compose.test.yml \
            --profile e2e --profile e2e-seed \
            run --rm erp-mssql-init

      - name: Playwright smoke senaryoları
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_ADMIN_EMAIL: admin@cargopilot.com
          E2E_ADMIN_PASSWORD: ${{ secrets.SEED_DEFAULT_ADMIN_PASSWORD || 'Admin@CargoPilot1!' }}
          E2E_ERP_SERVER: erp-mssql,1433
          E2E_ERP_DATABASE: ERPTEST
          E2E_ERP_USER: sa
          E2E_ERP_PASSWORD: ErpFake_Pass123!
        run: npx playwright test

      - name: Playwright raporunu yükle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

      - name: Servis loglarını göster (başarısızlık durumunda)
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml --profile e2e logs --tail=200

      - name: Servisleri durdur ve temizle
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml --profile e2e --profile e2e-seed down -v

  # ─── Test sunucusuna deploy: sadece test'e push'ta çalışır ──────────────────
  deploy-test-server:
    name: Deploy (Test Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migration-check, build, deploy]
    if: |
      always() &&
      (needs.migration-check.result == 'success') &&
      (needs.build.result == 'success') &&
      (needs.deploy.result == 'success') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/test'

    steps:
      # US-D27-I: Sunucu artık build yapmıyor; GHCR'dan pull edilen image'ı kullanıyor.
      # Packages public olduğundan PAT login gerekmez; IMAGE_TAG ile immutable tag kullanılır.
      - name: Sunucuya bağlan ve test stack'ini güncelle
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: root
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/cargo-pilot

            echo "==> test branch güncelleniyor..."
            git remote prune origin
            git fetch --prune origin
            git checkout test
            git reset --hard origin/test

            # GHCR paketleri public; login GEREKMEZ. Sunucuda kalmış eski/süresi dolmuş
            # bir ghcr.io kimlik bilgisi varsa docker anonim pull'a düşmez ve
            # "error from registry: denied" alır. Kalıntı kimlik bilgisini temizle.
            echo "==> Bayat GHCR kimlik bilgisi temizleniyor..."
            docker logout ghcr.io >/dev/null 2>&1 || true

            # Geri alma çıpası: hâlihazırda çalışan backend konteynerinin image
            # referansından mevcut tag türetilir (ör. ghcr.io/...:test-abc1234 -> test-abc1234).
            # Konteyner yoksa (ilk deploy) boş kalır ve geri alma denenmez.
            PREV_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' cargo-pilot-backend-test 2>/dev/null || true)"
            PREV_IMAGE_TAG="${PREV_IMAGE_REF##*:}"

            # Çıpa doğrulaması: `.Config.Image` digest biçiminde
            # (ghcr.io/...@sha256:abc...) veya tag'siz dönebilir. Bu durumlarda
            # `##*:` geçerli bir tag değil, sha hex'i ya da tüm referans üretir.
            # Geri alma böyle bir değerle denenirse `up` var olmayan bir image
            # arar ve ortam bugünküne göre DAHA KÖTÜ duruma düşer. Şüpheliyse
            # çıpa boşaltılır: geri alma atlanır, davranış mevcut hâle eşitlenir.
            case "$PREV_IMAGE_REF" in
              *@*)      PREV_IMAGE_TAG="" ;;   # digest referansı, tag yok
              *:*)      : ;;                   # ref:tag — beklenen biçim
              *)        PREV_IMAGE_TAG="" ;;   # hiç ':' yok, tag belirtilmemiş
            esac
            case "$PREV_IMAGE_TAG" in
              ""|*/*|*" "*) PREV_IMAGE_TAG="" ;;  # boş, yol parçası ya da boşluk içeriyor
            esac

            if [ -z "$PREV_IMAGE_TAG" ]; then
              echo "==> Geri alma çıpası: <yok> (ref='${PREV_IMAGE_REF:-<bos>}' — geri alma atlanacak)"
            else
              echo "==> Geri alma çıpası: PREV_IMAGE_TAG=${PREV_IMAGE_TAG}"
            fi

            echo "==> Image'lar GHCR'dan çekiliyor (tag: ${IMAGE_TAG})..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose \
              -f infra/compose/docker-compose.test.yml \
              --env-file infra/env/.env.test \
              pull backend frontend

            # Tüm stack'i `down` etmek mssql ve minio'yu da kapatıyordu; deploy edilen
            # yalnız backend/frontend olduğu hâlde her deploy 2-3 dk kesinti üretiyordu.
            # `up -d` yalnız image digest'i veya servis tanımı değişen konteynerleri
            # yeniden yaratır: backend + frontend yeni tag'e geçer, mssql/minio/ağ/volume
            # dokunulmadan ayakta kalır. `--remove-orphans` semantiği korunuyor —
            # compose dosyasından çıkarılmış servislerin artık konteynerleri yine silinir.
            echo "==> Stack güncelleniyor (tag: ${IMAGE_TAG})..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose \
              -f infra/compose/docker-compose.test.yml \
              --env-file infra/env/.env.test \
              up -d --no-build --remove-orphans

            echo "==> Backend health (loopback) bekleniyor..."
            HEALTH_OK=0
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:8081/health >/dev/null; then HEALTH_OK=1; break; fi
              sleep 5
            done

            # Health düşerse bir önceki image tag'ine tek seferlik geri dönülür.
            # Geri alma sonucundan bağımsız olarak job kırmızı bırakılır (exit 1):
            # başarılı bir geri alma "deploy başarılı" anlamına gelmez.
            # Geri almanın kendisi için ikinci bir geri alma denenmez -> döngü yok.
            if [ "${HEALTH_OK}" != "1" ]; then
              echo "Backend loopback health basarisiz (tag: ${IMAGE_TAG})."
              if [ -n "${PREV_IMAGE_TAG}" ] && [ "${PREV_IMAGE_TAG}" != "${IMAGE_TAG}" ]; then
                echo "==> Otomatik geri alma: ${PREV_IMAGE_TAG}"
                IMAGE_TAG="${PREV_IMAGE_TAG}" docker compose \
                  -f infra/compose/docker-compose.test.yml \
                  --env-file infra/env/.env.test \
                  up -d --no-build --remove-orphans || echo "Geri alma komutu hata verdi."
                for i in $(seq 1 12); do
                  if curl -sf http://127.0.0.1:8081/health >/dev/null; then
                    echo "Geri alma tamamlandi, backend ${PREV_IMAGE_TAG} ile saglikli."
                    break
                  fi
                  sleep 5
                done
              else
                echo "Geri donulecek onceki image yok; stack oldugu gibi birakildi."
              fi
              echo "Deploy basarisiz."
              exit 1
            fi
            echo "Backend loopback health OK."

            # Prune yalnız health doğrulandıktan SONRA çalışır: aksi hâlde bir önceki
            # sürümün image'ı (aynı tag yeniden push edildiyse dangling'e düşer)
            # silinir ve geri dönüş için GHCR'dan tekrar pull gerekir.
            echo "==> Kullanılmayan eski image'lar temizleniyor..."
            docker image prune -f
