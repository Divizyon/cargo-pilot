name: Motor Doluluk Kapısı

# Yerleştirme motorunun doluluğunu BR1-BR7 (Bischoff & Ratcliff 1995, 700 örnek)
# üzerinde ölçer ve depodaki referansla karşılaştırır; gerilemede durur.
#
# `algorithm-suite.yml` ile karıştırılmamalı: o iş canlı bir backend'e ve
# veritabanına ihtiyaç duyar, uçtan uca akışı sınar ve dakikalar sürer. Bu iş saf
# hesaptır — bağımlılık yok, veritabanı yok, tek koşucu.
#
# Neden gecelik bir kapı: ölçüm düzeneği elle koşulduğu sürece çürür. Kapı
# olmadan doluluk düşüşü ancak birisi aynı komutu tekrar koştuğunda fark edilir.
#
# YALNIZCA statik sequencer ölçülür. Arama katmanının bütçesi duvar saatidir
# (SearchBudget.MaxDurationMs), yani yavaş bir koşucu daha az iterasyon yapar ve
# sonuç makineye bağlı çıkar — kapı gürültüden kalırdı. Statik yol saf hesaptır:
# aynı girdi her makinede bit birebir aynı sonucu verir.
on:
  push:
    branches:
      - feat/**
      - fix/**
      - hotfix/**
    paths:
      - 'apps/backend/CargoPilot.Application/Common/Optimization/**'
      - 'apps/backend/CargoPilot.Engine.Bench/**'
      - 'docs/algorithm/referans/br-*.json'
      - '.github/workflows/engine-bench.yml'
  pull_request:
    branches: [dev, test, main]
    paths:
      - 'apps/backend/CargoPilot.Application/Common/Optimization/**'
      - 'apps/backend/CargoPilot.Engine.Bench/**'
      - 'docs/algorithm/referans/br-*.json'
  schedule:
    # Her gece 03:00 UTC. algorithm-suite 02:00'de koşuyor; ikisi çakışmasın.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motor-doluluk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doluluk:
    name: BR1-BR7 Doluluk Kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Bench projesini derle
        run: dotnet build apps/backend/CargoPilot.Engine.Bench/CargoPilot.Engine.Bench.csproj --configuration Release

      # Tek yerlestirici kaldi (DR-39); greedy isi kaldirildi.
      - name: Duvar örücü — BR1-BR7
        run: |
          dotnet run --project apps/backend/CargoPilot.Engine.Bench --no-build --configuration Release -- \
            br --baseline "$GITHUB_WORKSPACE/docs/algorithm/referans/br-wallbuilder-static.json" \
               --report "$GITHUB_WORKSPACE/br-wallbuilder-run.json"

      # Kapi kaldiginda karsilastirmayi elle yapabilmek icin kosu ciktilari saklanir.
      - name: Koşu çıktılarını sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: br-kosu-ciktilari
          path: br-*-run.json
          if-no-files-found: warn
