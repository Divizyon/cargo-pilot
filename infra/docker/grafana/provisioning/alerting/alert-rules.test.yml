apiVersion: 1

groups:
  - orgId: 1
    name: cargo-pilot-alerts
    folder: Cargo Pilot
    interval: 1m
    rules:
      - uid: high-5xx-error-rate-test
        title: Yüksek 5xx Hata Oranı
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-test
            model:
              expr: sum(rate(http_requests_received_total{code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 2m
        annotations:
          summary: "Backend 5xx hata oranı yüksek ({{ $value | printf \"%.2f\" }} req/s)"
        labels:
          severity: critical
        noDataState: NoData
        execErrState: Error

      - uid: high-error-log-count-test
        title: Fazla Error Log
        condition: C
        data:
          - refId: A
            datasourceUid: loki-test
            model:
              expr: sum(count_over_time({job="cargo-pilot-test"} | json | level="Error" [5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 2m
        annotations:
          summary: "Son 5 dakikada {{ $value }} adet error log"
        labels:
          severity: warning
        noDataState: NoData
        execErrState: Error

      - uid: backend-health-degraded-test
        title: Backend Health Degraded
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-test
            model:
              expr: up{job="cargo-pilot-backend-test"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 1m
        annotations:
          summary: "Backend scrape hedefi erişilemiyor"
        labels:
          severity: critical
        noDataState: Alerting
        execErrState: Alerting
