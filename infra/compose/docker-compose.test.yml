name: cargo-pilot-test

services:
  backend:
    # US-D27-I: Image GHCR'dan çekilir; build yalnızca local geliştirme için.
    image: ghcr.io/${GHCR_OWNER:-divizyon}/cargo-pilot-backend:${IMAGE_TAG:-test}
    platform: linux/amd64
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: cargo-pilot-backend-test
    # F1-02: standalone `docker compose up` ile calisiyoruz (Swarm degil), bu yuzden
    # deploy.resources.limits yok sayilir; mem_limit standalone'da bagliyicidir.
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://+:8080
      # Host header doğrulaması; test sunucusunda .env ile domain verilir.
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      MSSQL_HOST: mssql
      MSSQL_PORT: 1433
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__BucketName: ${MINIO_BUCKET}
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-}
      # Test ortamında admin seed AÇIK: QA'in giriş yapabileceği bir hesap
      # gerekiyor ve kod bu yolda MustChangePassword'ü zorluyor. Kapatmak için
      # .env.test'te SEED_ENABLE_ADMIN_SEED=false yeterlidir.
      Seed__EnableAdminSeed: ${SEED_ENABLE_ADMIN_SEED:-true}
      Seed__DefaultAdminPassword: ${Seed__DefaultAdminPassword}
      Jwt__Secret: ${JWT_SECRET}
      OAuth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      OAuth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      OAuth__Google__CallbackUrl: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      OAuth__Google__FrontendCallbackUrl: ${GOOGLE_OAUTH_FRONTEND_CALLBACK_URL:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-}
      # /metrics ve /health/detail icin dar kapsamli scrape kimlik bilgisi (SEC-07 takibi).
      # Prometheus ayni degeri secrets/metrics-token dosyasindan okur.
      Metrics__ScrapeToken: ${METRICS_SCRAPE_TOKEN:-}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromEmail: ${RESEND_FROM_EMAIL:-}
      Resend__FromName: ${RESEND_FROM_NAME:-}
      PasswordReset__FrontendResetUrl: ${PASSWORD_RESET_FRONTEND_URL:-}
      EmailChange__FrontendConfirmUrl: ${EMAIL_CHANGE_FRONTEND_CONFIRM_URL:-}
      EmailChange__TokenExpiryMinutes: ${EMAIL_CHANGE_TOKEN_EXPIRY_MINUTES:-60}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    depends_on:
      mssql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cargo-pilot-test

  frontend:
    # US-D27-I: Image GHCR'dan çekilir; build yalnızca local geliştirme için.
    image: ghcr.io/${GHCR_OWNER:-divizyon}/cargo-pilot-frontend:${IMAGE_TAG:-test}
    platform: linux/amd64
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_BASE_URL: Boş bırakılırsa nginx /api proxy devreye girer (CORS yok).
        # Domain için: VITE_API_BASE_URL=https://cargopilot.divizyon.org
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
        VITE_APP_ENV: test
        VITE_OAUTH_GOOGLE_URL: ${VITE_OAUTH_GOOGLE_URL:-}
        VITE_OAUTH_MICROSOFT_URL: ${VITE_OAUTH_MICROSOFT_URL:-}
    container_name: cargo-pilot-frontend-test
    mem_limit: 256m
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    # D-49: imaj nginx:1.31-alpine tabanli; busybox wget mevcut. Ayri bir /health
    # ucu yok, kok yol index.html'i 200 ile donduruyor.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cargo-pilot-test

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cargo-pilot-mssql-test
    user: root
    # F1-02 / D-39: mem_limit container tavanı; MSSQL_MEMORY_LIMIT_MB bunun altında
    # tutulan SQL Server "max server memory" hedefidir.
    mem_limit: 3072m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # D-39: tanımsızsa SQL Server host RAM'inin ~%80'ini hedefler; mem_limit'in
      # (3072m) altında sabit bir tavan veriyoruz.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "127.0.0.1:${MSSQL_PORT}:1433"
    volumes:
      - mssql_data_test:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - cargo-pilot-test

  # ─── Sahte ERP MSSQL (yalnizca e2e profili) ─────────────────────────────────
  # Test sunucusundaki stack'e sizmasin diye profile arkasinda durur; ancak
  # `--profile e2e` verildiginde ayaga kalkar.
  erp-mssql:
    profiles: ["e2e"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cargo-pilot-erp-mssql-test
    user: root
    # F1-02: bu servis yalnizca CI (GitHub Actions runner) uzerinde --profile e2e ile
    # kalkar, prod sunucusunun 16 GB butcesine girmez; yine de tavan konuluyor.
    mem_limit: 1536m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ERP_MSSQL_SA_PASSWORD:-ErpFake_Pass123!}
      SA_PASSWORD: ${ERP_MSSQL_SA_PASSWORD:-ErpFake_Pass123!}
      # Uygulama MSSQL'i ile ayni makinede kostugu icin bellek siniri verilir.
      MSSQL_MEMORY_LIMIT_MB: ${ERP_MSSQL_MEMORY_LIMIT_MB:-1024}
    ports:
      - "${ERP_MSSQL_PORT:-1435}:1433"
    volumes:
      - erp_mssql_data_test:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - cargo-pilot-test

  # Tek seferlik tohumlama; `docker compose run --rm erp-mssql-init` ile calisir.
  # Ayri profilde tutulur ki `up --wait` cikan bir konteyneri beklemeye calismasin.
  erp-mssql-init:
    profiles: ["e2e-seed"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cargo-pilot-erp-mssql-init-test
    user: root
    mem_limit: 256m
    environment:
      ERP_MSSQL_SA_PASSWORD: ${ERP_MSSQL_SA_PASSWORD:-ErpFake_Pass123!}
    depends_on:
      erp-mssql:
        condition: service_healthy
    volumes:
      - ../docker/erp-mssql/init:/erp-init:ro
    entrypoint: ["/bin/bash", "-c"]
    # Tek elemanli liste sart: duz dize verilirse compose argumanlara boler ve
    # bash -c yalnizca ilk kelimeyi calistirir.
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S erp-mssql,1433 -U sa
        -P "$${ERP_MSSQL_SA_PASSWORD}" -C -b -f 65001 -i /erp-init/01-netsis-seed.sql
    restart: "no"
    networks:
      - cargo-pilot-test

  minio:
    # DEP-01 GERI ALINDI (2026-08-19): 2024-01-31 sürümü denendi ve test
    # sunucusunu düşürdü — mevcut minio volume'ü eski tek-disk FS formatında,
    # 2022-10 sonrası sürümler bu formatın desteğini kaldırdı; container
    # açılışta çöküyor (test-deploy run 32183514573). CVE'ler (CVE-2023-28432/
    # 28434, CVE-2024-24747, CVE-2022-31028) bilinçli olarak açık kalıyor;
    # kalıcı çözüm veri migrasyonu ister (eski sürümden yeni instance'a
    # `mc mirror`) ve devops-backlog'a kayıtlıdır. Dependabot bu image'ı
    # önermesin diye .github/dependabot.yml'de ignore kuralı var.
    image: quay.io/minio/minio:RELEASE.2022-01-08T03-11-54Z
    platform: linux/amd64
    container_name: cargo-pilot-minio-test
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data_test:/data
    healthcheck:
      # 2022-01-08 image'ında curl VAR; mc tabanlı `mc ready` bu eski sürümde
      # yok, bu yüzden curl tabanlı probe kullanılır.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - cargo-pilot-test

volumes:
  mssql_data_test:
    name: cargo-pilot-mssql-data-test
  erp_mssql_data_test:
    name: cargo-pilot-erp-mssql-data-test
  minio_data_test:
    name: cargo-pilot-minio-data-test

networks:
  cargo-pilot-test:
    name: cargo-pilot-test-network
